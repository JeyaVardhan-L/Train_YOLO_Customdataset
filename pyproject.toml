[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-airborne-detection"
version = "1.0.0"
description = "Airborne and sky object detection (aircrafts, birds, drones) using YOLO11"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "JeyaVardhan-L" }
]
keywords = [
    "yolo",
    "yolo11",
    "object-detection",
    "computer-vision",
    "drone-detection",
    "aircraft-detection",
    "ultralytics"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.0",
    "matplotlib>=3.7.0",
    "pillow>=9.5.0",
]

[project.optional-dependencies]
hardware = [
    "pyserial>=3.5",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/JeyaVardhan-L/Train_YOLO_Customdataset"
