# Dataset configuration for Aerial / Sky Object Detection (Aircrafts, Birds, Drones)
# Ground truth classes: 3 (verified against all 8,888 dataset annotations)

path: data # Dataset directory relative to repository root
train: train/images
val: validation/images

# Class mapping (0-indexed)
names:
  0: Aircrafts
  1: Bird
  2: Drone

